<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Task Manager</h1>
    <p>Organize your tasks and stay productive.</p>
    <div>
        <input id="task-input" type="text" placeholder="Enter a new task">
        <button id="clear-search-btn" type="button">Clear Search</button>
        <button id="add-task-btn">Add Task</button>
    </div>
    <h2>My Tasks</h2>
    <input id="task-search" type="text" placeholder="Search tasks...">
    <div id="task-filters">
        <button id="filter-all">All</button>
        <button id="filter-active">Active</button>
        <button id="filter-completed">Completed</button>
    </div>
    <ul id="task-list"></ul>
    <p id="task-counter">0 tasks remaining</p>
    <button id="clear-completed-btn" type="button">Clear Completed Tasks</button>
</body>
</html>
